<!DOCTYPE html>
<html>
<head>
  <title>My Art Portfolio</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }
    header {
      padding: 60px;
      background: #222;
    }
    h1 {
      font-size: 40px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      padding: 20px;
      background: #222;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Art Portfolio</h1>
  <p>Paintings • Digital Art • Creative Works</p>
</header>

<section class="gallery">
  <img src="https://via.placeholder.com/400" />
  <img src="https://via.placeholder.com/400" />
  <img src="https://via.placeholder.com/400" />
</section>

<footer>
  <p>Contact: yournumber / Instagram</p>
</footer>

</body>
</html>
